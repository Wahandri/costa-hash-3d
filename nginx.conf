server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/json json;
        text/plain pck;
        image/png png;
        image/svg+xml svg;
        application/octet-stream bin;
    }
    default_type application/octet-stream;

    # El juego se re-exporta a menudo: no cachear el html ni el arranque
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # PWA: MIME correctos (si no, el navegador rechaza el service worker/manifest)
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # El build cambia con frecuencia y la URL es fija -> revalidar siempre
    # wasm y pck (si no, el navegador/Cloudflare sirve una version vieja).
    location ~* \.(?:wasm|pck)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Imagenes y demas: cacheables.
    location ~* \.(?:png|svg|json|worklet\.js)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
